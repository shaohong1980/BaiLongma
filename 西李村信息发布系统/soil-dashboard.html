<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西李村 · 土壤监测大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e6ed; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; overflow-y: auto; }
.header { text-align: center; padding: 18px 0 10px; background: linear-gradient(180deg, #111827 0%, #0a0e17 100%); }
.header h1 { font-size: 28px; letter-spacing: 4px; background: linear-gradient(90deg, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .sub { font-size: 13px; color: #6b7280; margin-top: 4px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 10px 16px 16px; }
.card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; }
.card-title { font-size: 14px; color: #9ca3af; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.card-title .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.ok { background: #34d399; box-shadow: 0 0 6px #34d399; }
.dot.warn { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
.dot.bad { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
.chart { height: 280px; }
.gauge-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }
.gauge-card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; align-items: center; }
.gauge-card .label { font-size: 13px; color: #9ca3af; margin-bottom: 4px; }
.gauge-chart { width: 100%; height: 160px; }
.diagnosis-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; padding-bottom: 20px; }
.diag-card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 16px; }
.diag-card .diag-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.diag-card .diag-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
.diag-status.severe { background: #7f1d1d; color: #fca5a5; }
.diag-status.abnormal { background: #78350f; color: #fcd34d; }
.diag-status.normal { background: #064e3b; color: #6ee7b7; }
.diag-card .diag-body { font-size: 13px; line-height: 1.8; color: #d1d5db; }
.diag-body .issue { color: #f87171; }
.diag-body .suggest { color: #34d399; }
.diag-body .ok { color: #6ee7b7; }
</style>
</head>
<body>
<div class="header">
  <h1>西李村 · 土壤监测大屏</h1>
  <div class="sub">河南省科技特派员 · 张诗红 | 数据刷新：<span id="refresh-time">--</span></div>
</div>
<div class="grid" id="charts-row"></div>
<div class="gauge-row" id="gauge-row"></div>
<div class="diagnosis-row" id="diag-row"></div>

<script>
const STATIONS = ['村北药材基地', '村东小麦田', '村西蔬菜大棚'];
const COLORS = ['#60a5fa', '#fbbf24', '#34d399'];

// --- 智能诊断引擎 ---
function diagnose(station, latest) {
  const issues = [];
  const suggests = [];
  const m = latest.moisture ?? 50;
  const t = latest.temperature ?? 25;
  const ph = latest.ph ?? 7;
  const n = latest.nitrogen ?? 100;
  const p = latest.phosphorus ?? 50;
  const k = latest.potassium ?? 100;

  // 湿度诊断
  if (m < 20) { issues.push('土壤严重干旱，含水量仅' + m.toFixed(1) + '%'); suggests.push('立即灌溉，建议滴灌或喷灌，每亩30-40方水'); }
  else if (m < 40) { issues.push('土壤偏干，含水量' + m.toFixed(1) + '%'); suggests.push('适时灌溉，每亩15-20方水'); }
  else if (m > 80) { issues.push('土壤过湿，含水量' + m.toFixed(1) + '%'); suggests.push('注意排水，暂停灌溉，防止烂根'); }

  // pH诊断
  if (ph < 5.0) { issues.push('土壤严重酸化，pH仅' + ph.toFixed(2)); suggests.push('施用生石灰50-80kg/亩中和酸性，避免种豆科作物'); }
  else if (ph < 5.5) { issues.push('土壤偏酸，pH ' + ph.toFixed(2)); suggests.push('施用石灰30-50kg/亩，增施有机肥改良'); }
  else if (ph > 8.0) { issues.push('土壤偏碱，pH ' + ph.toFixed(2)); suggests.push('施用硫磺粉或石膏改良，多施酸性肥料（硫酸铵）'); }
  else if (ph > 8.5) { issues.push('土壤严重碱化，pH ' + ph.toFixed(2)); suggests.push('施用硫磺粉80-100kg/亩，配合灌水洗盐'); }

  // 氮诊断
  if (n < 60) { issues.push('氮含量严重不足（' + n.toFixed(1) + 'mg/kg）'); suggests.push('追施尿素10-15kg/亩，或碳酸氢铵25-30kg/亩'); }
  else if (n < 90) { issues.push('氮含量偏低（' + n.toFixed(1) + 'mg/kg）'); suggests.push('追施尿素5-8kg/亩'); }
  else if (n > 200) { issues.push('氮含量过高（' + n.toFixed(1) + 'mg/kg），易徒长倒伏'); suggests.push('暂停氮肥施用，增施磷钾肥平衡'); }

  // 磷诊断
  if (p < 20) { issues.push('磷严重缺乏（' + p.toFixed(1) + 'mg/kg）'); suggests.push('施用过磷酸钙30-40kg/亩，或钙镁磷肥'); }
  else if (p < 40) { issues.push('磷含量偏低（' + p.toFixed(1) + 'mg/kg）'); suggests.push('补施过磷酸钙15-20kg/亩'); }

  // 钾诊断
  if (k < 80) { issues.push('钾含量不足（' + k.toFixed(1) + 'mg/kg）'); suggests.push('追施硫酸钾10-15kg/亩，或草木灰50kg/亩'); }
  else if (k < 120) { issues.push('钾含量偏低（' + k.toFixed(1) + 'mg/kg）'); suggests.push('补施硫酸钾5-8kg/亩'); }

  // 温度诊断
  if (t > 38) { issues.push('土壤温度过高（' + t.toFixed(1) + '°C），根系易受损'); suggests.push('覆盖秸秆或遮阳网降温，傍晚浇水'); }
  else if (t < 5) { issues.push('土壤温度过低（' + t.toFixed(1) + '°C）'); suggests.push('覆盖地膜保温，减少浇水频率'); }

  // 综合建议
  if (station === '村北药材基地') {
    if (ph < 5.5) suggests.push('药材基地偏酸不适宜种黄芪、党参，可改种耐酸的丹参、黄连');
  }
  if (station === '村东小麦田') {
    if (n < 90) suggests.push('小麦拔节期需氮量大，建议结合灌水追肥');
  }
  if (station === '村西蔬菜大棚') {
    if (m > 75) suggests.push('大棚湿度偏高，注意通风降湿防病害');
  }

  return { issues, suggests };
}

function renderDiagnosis(station, latest, containerId) {
  const diag = diagnose(station, latest);
  const status = latest.status || 'normal';
  const statusLabel = status === 'severe' ? '⚠ 严重' : status === 'abnormal' ? '⚡ 异常' : '✓ 正常';

  let html = '<div class="diag-title">';
  html += station + ' <span class="diag-status ' + status + '">' + statusLabel + '</span>';
  html += '</div><div class="diag-body">';

  if (diag.issues.length === 0) {
    html += '<span class="ok">各项指标正常，无需特殊处理。</span>';
  } else {
    for (const iss of diag.issues) {
      html += '<div class="issue">⚠ ' + iss + '</div>';
    }
    html += '<div style="margin-top:8px;border-top:1px solid #1f2937;padding-top:8px;">';
    for (const sug of diag.suggests) {
      html += '<div class="suggest">→ ' + sug + '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  document.getElementById(containerId).innerHTML = html;
}

// --- 图表初始化 ---
function initChart(domId) {
  return echarts.init(document.getElementById(domId));
}

const lineOption = (data, color) => ({
  grid: { top: 8, right: 12, bottom: 24, left: 40 },
  tooltip: { trigger: 'axis', backgroundColor: '#1f2937', borderColor: '#374151', textStyle: { color: '#e0e6ed', fontSize: 12 } },
  xAxis: { type: 'category', data: data.map(d => d.time), axisLine: { lineStyle: { color: '#374151' } }, axisLabel: { color: '#6b7280', fontSize: 10, rotate: 30 } },
  yAxis: [
    { type: 'value', name: '°C / %', nameTextStyle: { color: '#6b7280', fontSize: 10 }, axisLabel: { color: '#6b7280', fontSize: 10 }, splitLine: { lineStyle: { color: '#1f2937' } } },
    { type: 'value', name: 'pH', nameTextStyle: { color: '#6b7280', fontSize: 10 }, axisLabel: { color: '#6b7280', fontSize: 10 }, splitLine: { show: false } }
  ],
  series: [
    { name: '温度°C', type: 'line', data: data.map(d => d.temp), smooth: true, lineStyle: { color: '#f87171', width: 2 }, itemStyle: { color: '#f87171' }, symbol: 'none' },
    { name: '湿度%', type: 'line', data: data.map(d => d.humidity), smooth: true, lineStyle: { color: '#60a5fa', width: 2 }, itemStyle: { color: '#60a5fa' }, symbol: 'none' },
    { name: 'pH', type: 'line', yAxisIndex: 1, data: data.map(d => d.ph), smooth: true, lineStyle: { color: '#a78bfa', width: 2, type: 'dashed' }, itemStyle: { color: '#a78bfa' }, symbol: 'none' }
  ]
});

function gaugeOption(value, color, label) {
  return {
    series: [{
      type: 'gauge', startAngle: 210, endAngle: -30, center: ['50%', '60%'], radius: '90%',
      min: 0, max: 100, splitNumber: 10,
      axisLine: { show: true, lineStyle: { width: 14, color: [[0.3, '#ef4444'], [0.6, '#fbbf24'], [1, '#34d399']] } },
      pointer: { length: '60%', width: 6, itemStyle: { color: color } },
      axisTick: { distance: -14, length: 6, lineStyle: { width: 1, color: '#6b7280' } },
      splitLine: { distance: -18, length: 12, lineStyle: { width: 2, color: '#6b7280' } },
      axisLabel: { color: '#6b7280', fontSize: 10, distance: 20 },
      detail: { valueAnimation: true, formatter: '{value}%', color: '#e0e6ed', fontSize: 18, offsetCenter: [0, '70%'] },
      data: [{ value: value, name: label }]
    }]
  };
}

// --- 构建DOM ---
(function buildDOM() {
  const chartsRow = document.getElementById('charts-row');
  const gaugeRow = document.getElementById('gauge-row');
  const diagRow = document.getElementById('diag-row');

  for (let i = 0; i < 3; i++) {
    chartsRow.innerHTML += '<div class="card"><div class="card-title"><span class="dot" id="dot'+(i+1)+'"></span>'+STATIONS[i]+'</div><div class="chart" id="chart'+(i+1)+'"></div></div>';
    gaugeRow.innerHTML += '<div class="gauge-card"><div class="label">'+STATIONS[i].replace('村北','').replace('村东','').replace('村西','')+' · 土壤湿度</div><div class="gauge-chart" id="gauge'+(i+1)+'a"></div></div>';
    diagRow.innerHTML += '<div class="diag-card" id="diag'+(i+1)+'"></div>';
  }
})();

const lineCharts = [initChart('chart1'), initChart('chart2'), initChart('chart3')];
const gaugeCharts = [initChart('gauge1a'), initChart('gauge2a'), initChart('gauge3a')];

async function fetchData() {
  try {
    const res = await fetch('http://localhost:8080/api/soil/history');
    const json = await res.json();
    const all = json.records || [];
    const now = new Date();
    document.getElementById('refresh-time').textContent = now.toLocaleTimeString('zh-CN');

    for (let i = 0; i < 3; i++) {
      const stationData = all.filter(d => d.station === STATIONS[i]);
      const recent = stationData.slice(-12).map(d => ({
        time: d.time ? d.time.slice(5, 16).replace('T', ' ') : '',
        temp: d.temperature ?? 0,
        humidity: d.moisture ?? 0,
        ph: d.ph ?? 7
      }));

      lineCharts[i].setOption(lineOption(recent, COLORS[i]), true);

      const latest = stationData[stationData.length - 1] || {};
      const hum = latest.moisture ?? 50;
      gaugeCharts[i].setOption(gaugeOption(hum, COLORS[i], STATIONS[i]), true);

      const status = latest.status || 'normal';
      const dot = document.getElementById('dot' + (i+1));
      dot.className = 'dot ' + (status === 'severe' ? 'bad' : status === 'abnormal' ? 'warn' : 'ok');

      // 智能诊断
      renderDiagnosis(STATIONS[i], latest, 'diag' + (i+1));
    }
  } catch (e) {
    console.error('数据获取失败:', e);
  }
}

fetchData();
setInterval(fetchData, 30000);

window.addEventListener('resize', () => {
  [...lineCharts, ...gaugeCharts].forEach(c => c.resize());
});
</script>
</body>
</html>
