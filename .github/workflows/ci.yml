name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # --ignore-scripts：CI 不重编原生模块（eslint 不需要）
      - run: npm ci --ignore-scripts
      - run: npx eslint src electron scripts --max-warnings=99999

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # 已知不可修复（sharp/adm-zip 来自 transformers ML 栈，见 docs/security.md）：
      # 报告但不阻断，避免 CI 因无上游修复而长期红。
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org
        continue-on-error: true

  test-node:
    name: 离线单测（纯 node）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node src/test-state-graph.js
      - run: node src/test-workflow-room.js
      - run: node src/test-llm-tool-loop.js
      - run: node src/test-key-auto-config.js

  # 注：完整测试套件（含 better-sqlite3 原生模块 / Electron）需 Windows runner + electron-rebuild，
  # 且部分测试依赖 LLM/网络，暂不在 CI 全量跑。本地请用 `npm run test:all`。
